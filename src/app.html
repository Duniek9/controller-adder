<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Controller Adder</title>
    <meta name="color-scheme" content="dark" />
    <style>
      :root {
        color-scheme: dark;
        --app-bg: #17171d;
        --app-surface: #202029;
        --app-surface-raised: #292933;
        --app-border: #3b3b48;
        --app-text: #e8e8ef;
        --app-muted: #a6a6b5;
        --app-accent: #8a75ed;
        --app-primary: #6246ea;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--app-bg);
        color: var(--app-text);
      }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--app-bg);
        color: var(--app-text);
      }
      body { min-height: 100vh; }
      *, *::before, *::after { box-sizing: border-box; }
      button, input, select, textarea { font: inherit; }
      select option { background: var(--app-surface-raised); color: var(--app-text); }
      :focus-visible { outline: 2px solid var(--app-accent); outline-offset: 3px; }
      ::selection { background: #51418c; color: #fff; }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
